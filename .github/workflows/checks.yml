name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_rules.py
      - run: ruff check src tests tools
      - name: Install D2
        run: python tools/install_d2.py "${{ runner.temp }}/d2-bin"
      - name: Check native renderer and Unicode paths
        run: python -m unittest discover -s tests -p test_native.py -v
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: run.bat --config examples/demo.json
      - name: Check Unix launcher
        if: runner.os != 'Windows'
        run: sh run.sh --config examples/demo.json
      - name: Render examples
        run: |
          python -m apt_graph --config examples/cycle.json
          python -m apt_graph --config examples/ubuntu-hello.json
          python -m apt_graph --config examples/ubuntu-make.json
          python -m apt_graph --config examples/ubuntu-gzip.json
      - name: Compare with apt
        if: runner.os == 'Linux'
        run: python tools/compare_apt.py --depth 3
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-examples-${{ runner.os }}
          path: output/
